name: Repair auth script syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auth-syntax-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed innerHTML assignments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'topbarAvatar.innerHTML = <span style="font-weight:800; font-size:13px; color:var(--gold-primary);"> + initial + </span>;': 'topbarAvatar.innerHTML = `<span style="font-weight:800; font-size:13px; color:var(--gold-primary);">${initial}</span>`;',
              'topbarAvatar.innerHTML = <span class="material-symbols-outlined" style="font-size:18px; color:var(--gold-primary);">person</span>;': 'topbarAvatar.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px; color:var(--gold-primary);">person</span>`;',
              'topbarAvatar.innerHTML = <span class="material-symbols-outlined" style="font-size:18px;">lock</span>;': 'topbarAvatar.innerHTML = `<span class="material-symbols-outlined" style="font-size:18px;">lock</span>`;',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
              print('Auth syntax repaired.')
          else:
              print('No malformed auth innerHTML patterns found.')
          PY
      - name: Commit repair and remove one-time workflow
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          rm -f .github/workflows/repair-auth-syntax.yml
          git add .github/workflows/repair-auth-syntax.yml
          git commit -m 'fix(auth): repair malformed inline HTML assignments [auth-syntax-fix]'
          git push
